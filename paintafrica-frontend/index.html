<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PaintAfrica — order printing, branding, and design work from vetted African printing businesses and designers." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="PaintAfrica — Print & Design Marketplace" />
    <meta property="og:description" content="Order printing, branding and design work from vetted African businesses and designers." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaintAfrica" />

    <!-- Favicons & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts (preconnect + stylesheet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <link rel="stylesheet" href="/initial.css" />

    <div id="root">
      <div class="initial-loading" aria-live="polite">Loading PaintAfrica…</div>

    </noscript>
    <script type="module" src="/src/main.jsx"></script>
